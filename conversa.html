<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversa | PetSOS</title>
  <meta name="description" content="Conversa sobre um anúncio do PetSOS.">
  <meta name="theme-color" content="#F4F5F2">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="wrap" id="conteudo" tabindex="-1">
    <a class="back-link" href="/conversas">Voltar para mensagens</a>
    <div id="page-error"></div>
    <div class="chat-layout" id="chat-root" hidden>
      <section class="panel chat" aria-labelledby="chat-title">
        <div class="chat-head" id="chat-head"></div>
        <ol class="chat-log" id="chat-log" aria-live="polite" aria-label="Mensagens"></ol>
        <form class="chat-compose" id="compose" novalidate>
          <label class="compose-label" for="message">Mensagem</label>
          <textarea id="message" name="message" maxlength="1000" rows="1" required></textarea>
          <button type="submit" class="btn btn-primary" id="send-btn">Enviar</button>
          <p class="field-error" id="compose-error" role="alert"></p>
        </form>
      </section>
      <details class="panel handover" id="handover-box">
        <summary><h2>Entrega do animal</h2> <span class="handover-status" id="handover-status"></span></summary>
        <div class="handover-body">
          <div id="handover"></div>
          <div class="safety" id="safety"></div>
        </div>
      </details>
    </div>
  </main>
  <script type="module" src="/assets/js/conversation.js"></script>
</body>
</html>
