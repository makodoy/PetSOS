<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anúncio | PetSOS</title>
  <meta name="description" content="Detalhes do anúncio e animais parecidos.">
  <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E2421" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">PetSOS</a>
      <nav class="nav" id="site-nav" aria-label="Principal">
        <a href="/" data-nav>Animais</a>
        <a href="/conversas" data-nav data-auth="in" hidden>Mensagens</a>
        <a href="/meus" data-nav data-auth="in" hidden>Meus anúncios</a>
        <a href="/admin" data-nav data-admin hidden>Moderação</a>
        <a href="/entrar" data-nav data-auth="out">Entrar</a>
        <button type="button" class="link-button" data-auth="in" data-action="signout" hidden>Sair</button>
      </nav>
      <a class="btn btn-primary btn-header" href="/anunciar">Anunciar<span class="btn-label-long">&nbsp;animal</span></a>
      <button type="button" class="btn btn-secondary menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </header>
  <main class="wrap">
    <a class="back-link" href="/">Voltar para a lista</a>
    <div id="page-error"></div>
    <div id="detail-root" aria-busy="true">
      <div class="detail">
        <div class="detail-photo" aria-hidden="true"></div>
        <div class="detail-info"><div class="skeleton-row" style="padding:0"><span></span><span></span></div></div>
      </div>
    </div>

    <section class="section" id="matches-section" hidden aria-labelledby="matches-title">
      <div class="section-head">
        <h2 id="matches-title">Animais parecidos</h2>
        <p class="muted" id="matches-intro"></p>
      </div>
      <div class="panel" id="matches-panel"></div>
    </section>
  </main>
  <script type="module" src="/assets/js/report-detail.js"></script>
</body>
</html>
