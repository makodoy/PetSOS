<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderação | PetSOS</title>
  <meta name="description" content="Aprovação de anúncios e revisões de entrega.">
  <meta name="theme-color" content="#F4F5F2">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="wrap" id="conteudo" tabindex="-1">
    <div class="page-head" style="margin-top:var(--s6)">
      <h1>Moderação</h1>
      <p>Revise anúncios e analise denúncias.</p>
    </div>
    <div id="page-error"></div>
    <div id="admin-root" hidden>
      <dl class="facts admin-metrics" id="metrics"></dl>
      <div class="tabs" role="tablist" aria-label="Filas de moderação">
        <button type="button" role="tab" id="tab-reports" aria-controls="panel-reports" aria-selected="true">Anúncios <span class="tab-count" id="count-reports"></span></button>
        <button type="button" role="tab" id="tab-flags" aria-controls="panel-flags" aria-selected="false" tabindex="-1">Denúncias <span class="tab-count" id="count-flags"></span></button>
      </div>
      <section class="panel" role="tabpanel" id="panel-reports" aria-labelledby="tab-reports">
        <ul class="report-list" id="pending-reports"></ul>
      </section>
      <section class="panel" role="tabpanel" id="panel-flags" aria-labelledby="tab-flags" hidden>
        <ul class="report-list" id="open-flags"></ul>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
