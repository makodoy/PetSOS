<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderação | PetSOS</title>
  <meta name="description" content="Aprovação de anúncios e revisões de entrega.">
  <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E2421" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">PetSOS</a>
      <nav class="nav" id="site-nav" aria-label="Principal">
        <a href="/" data-nav>Animais</a>
        <a href="/conversas" data-nav data-auth="in" hidden>Mensagens</a>
        <a href="/meus" data-nav data-auth="in" hidden>Meus anúncios</a>
        <a href="/admin" data-nav data-admin hidden>Moderação</a>
        <a href="/entrar" data-nav data-auth="out">Entrar</a>
        <button type="button" class="link-button" data-auth="in" data-action="signout" hidden>Sair</button>
      </nav>
      <a class="btn btn-primary btn-header" href="/anunciar">Anunciar<span class="btn-label-long">&nbsp;animal</span></a>
      <button type="button" class="btn btn-secondary menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    </div>
  </header>
  <main class="wrap">
    <div class="page-head" style="margin-top:var(--s6)">
      <h1>Moderação</h1>
      <p>Aprove anúncios novos e revise as conversas antes de liberar uma entrega.</p>
    </div>
    <div id="page-error"></div>
    <div id="admin-root" hidden>
      <div class="tabs" role="tablist" aria-label="Filas de moderação">
        <button type="button" role="tab" id="tab-reports" aria-controls="panel-reports" aria-selected="true">Anúncios pendentes <span class="tab-count" id="count-reports"></span></button>
        <button type="button" role="tab" id="tab-handovers" aria-controls="panel-handovers" aria-selected="false" tabindex="-1">Revisões de entrega <span class="tab-count" id="count-handovers"></span></button>
      </div>
      <section class="panel" role="tabpanel" id="panel-reports" aria-labelledby="tab-reports">
        <ul class="report-list" id="pending-reports"></ul>
      </section>
      <section class="panel" role="tabpanel" id="panel-handovers" aria-labelledby="tab-handovers" hidden>
        <ul class="report-list" id="pending-handovers"></ul>
      </section>
    </div>
  </main>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
