<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetSOS: animais perdidos e encontrados em Itapetininga</title>
  <meta name="description" content="Anuncie e encontre animais perdidos e encontrados em Itapetininga e região.">
  <meta name="theme-color" content="#F4F5F2">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="wrap" id="conteudo" tabindex="-1">
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">Animais perdidos e encontrados em Itapetininga</h1>
      <div class="intro-actions">
        <a class="btn btn-secondary" href="/anunciar?tipo=perdido"><span class="marker marker-lost" aria-hidden="true"></span>Perdi um animal</a>
        <a class="btn btn-secondary" href="/anunciar?tipo=encontrado"><span class="marker marker-found" aria-hidden="true"></span>Encontrei um animal</a>
      </div>
    </section>

    <div id="page-error"></div>

    <form class="filters" id="filters" aria-label="Filtrar anúncios">
      <div class="filter filter-kind">
        <span id="kind-label">Tipo</span>
        <div class="segmented" role="group" aria-labelledby="kind-label">
          <button type="button" data-kind="all" aria-pressed="true">Todos</button>
          <button type="button" data-kind="lost" aria-pressed="false">Perdidos</button>
          <button type="button" data-kind="found" aria-pressed="false">Encontrados</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filter-more">Filtros</button>
      <div class="filter-more" id="filter-more">
        <label class="filter"><span>Espécie</span>
          <select name="species">
            <option value="">Todas</option>
            <option value="dog">Cão</option>
            <option value="cat">Gato</option>
            <option value="other">Outro animal</option>
          </select>
        </label>
        <label class="filter"><span>Porte</span>
          <select name="size">
            <option value="">Todos</option>
            <option value="small">Pequeno</option>
            <option value="medium">Médio</option>
            <option value="large">Grande</option>
          </select>
        </label>
        <label class="filter"><span>Cor</span>
          <select name="color" id="color-filter"><option value="">Todas</option></select>
        </label>
      </div>
    </form>

    <div class="segmented view-toggle" role="group" aria-label="Forma de ver os anúncios">
      <button type="button" data-view="list" aria-pressed="true">Lista</button>
      <button type="button" data-view="map" aria-pressed="false">Mapa</button>
    </div>

    <div class="browse" id="browse" data-view="list">
      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="list-head">
          <div>
            <h2 id="list-title">Anúncios</h2>
            <p class="muted small" id="result-count" aria-live="polite">Carregando anúncios…</p>
          </div>
          <button type="button" class="btn btn-secondary btn-small" id="clear-filters" hidden>Limpar filtros</button>
        </div>
        <ul class="report-grid" id="report-list">
          <li class="skeleton-card" aria-hidden="true"><span></span><span></span></li>
          <li class="skeleton-card" aria-hidden="true"><span></span><span></span></li>
          <li class="skeleton-card" aria-hidden="true"><span></span><span></span></li>
          <li class="skeleton-card" aria-hidden="true"><span></span><span></span></li>
        </ul>
        <div class="load-more" id="load-more" hidden><button type="button" class="btn btn-secondary" id="load-more-btn">Carregar mais animais</button></div>
      </section>
      <div class="map-pane panel">
        <div id="map" class="map" role="region" aria-label="Mapa dos anúncios"></div>
        <ul class="map-legend" aria-label="Legenda do mapa">
          <li><span class="dot dot-lost"></span>Perdido</li>
          <li><span class="dot dot-found"></span>Encontrado</li>
          <li><span class="dot dot-closed"></span>Reencontrado</li>
        </ul>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/home.js"></script>
</body>
</html>
